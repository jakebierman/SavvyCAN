name: Build

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to build and publish (leave blank for a test build)"
        required: false
        type: string
jobs:
  validate:
    name: Unit and capability tests
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Prepare Qt 5.15.2
        uses: jurplel/install-qt-action@v3
        with:
          version: "5.15.2"
          cache: true

      - name: Build and run payload formatter tests
        run: |
          mkdir -p build-tests/payloadformatter
          cd build-tests/payloadformatter
          qmake ../../test/payloadformatter.pro
          make -j2
          ./tst_payloadformatter

      - name: Build and run AI skill tests
        run: |
          mkdir -p build-tests/aiskills
          cd build-tests/aiskills
          qmake ../../test/aiskills.pro
          make -j2
          ./aiskills

  buildlinux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Prepare Environment
        run: |
            sudo apt-get install libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxkbcommon-x11-0 libfuse2

      - name: Prepare Qt Libraries
        uses: jurplel/install-qt-action@v3

      - name: Clone
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Compile
        run: |
          qmake CONFIG+=release PREFIX=/usr SavvyCAN.pro
          make -j`grep -c ^processor /proc/cpuinfo`
          
      - name: Package     
        run: |
          make INSTALL_ROOT=appdir install
          wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage
          ./linuxdeployqt-continuous-x86_64.AppImage appdir/usr/share/applications/SavvyCAN.desktop -appimage -extra-plugins=iconengines,platformthemes/libqgtk3.so,canbus

      - uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-Linux_x64.AppImage
          path: SavvyCAN-*x86_64.AppImage
      
  buildmacos86:
    name: macOS x64
    runs-on: macos-15-intel

    steps:
      - name: Prepare macOS Environment
        run: |
            brew install qt@5
            brew link qt@5 --force

      - name: Clone
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Compile     
        run: |
          qmake CONFIG+=release CONFIG+=sdk_no_version_check SavvyCAN.pro
          make -j`sysctl kern.aioprocmax | awk '{print $2}'`
          lrelease translations/*.ts

      - name: Package     
        run: |
          mkdir -p SavvyCAN.app/Contents/MacOS/translations
          mkdir -p SavvyCAN.app/Contents/MacOS/help
          cp -R translations/*.qm SavvyCAN.app/Contents/MacOS/translations
          cp -R help/* SavvyCAN.app/Contents/MacOS/help
          macdeployqt SavvyCAN.app -dmg
          mv SavvyCAN.dmg SavvyCAN_x64.dmg
      
      - uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-macOS_x64.dmg
          path: SavvyCAN_x64.dmg

  buildmacos-arm64:
    name: macOS ARM64
    runs-on: macos-15

    steps:
      - name: Prepare macOS Environment
        run: |
            brew install qt@5
            brew link qt@5 --force

      - name: Clone
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Compile     
        run: |
          qmake CONFIG+=release CONFIG+=sdk_no_version_check SavvyCAN.pro
          make -j`sysctl kern.aioprocmax | awk '{print $2}'`
          lrelease translations/*.ts
      
      - name: Package     
        run: |
          mkdir -p SavvyCAN.app/Contents/MacOS/translations
          mkdir -p SavvyCAN.app/Contents/MacOS/help
          cp -R translations/*.qm SavvyCAN.app/Contents/MacOS/translations
          cp -R help/* SavvyCAN.app/Contents/MacOS/help
          macdeployqt SavvyCAN.app -dmg
          mv SavvyCAN.dmg SavvyCAN_arm64.dmg
      
      - uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-macOS_ARM64.dmg
          path: SavvyCAN_arm64.dmg
          
  buildwindows:
    name: Windows x64
    runs-on: windows-2022

    steps:      
      - name: Prepare Qt Libraries
        uses: jurplel/install-qt-action@v3

      - name: Clone
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      
      - name: Compile
        shell: cmd
        run: | 
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          qmake CONFIG+=release SavvyCAN.pro
          nmake /C
          for %%f in (translations\*.ts) do lrelease "%%f"

      - name: Package
        shell: pwsh
        run: |
          $packageDirectories = @(
            "package",
            "package/help",
            "package/examples",
            "package/translations"
          )
          New-Item -ItemType Directory -Force -Path $packageDirectories | Out-Null

          $executable = @(
            "release/SavvyCAN.exe",
            "SavvyCAN.exe",
            "debug/SavvyCAN.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $executable) {
            $executable = Get-ChildItem -Path . -Filter SavvyCAN.exe -File -Recurse |
              Where-Object { $_.FullName -notlike "*\package\*" } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $executable) {
            throw "SavvyCAN.exe was not produced by the Windows build"
          }

          Write-Host "Packaging executable: $executable"
          $packagedExecutable = "package/SavvyCAN.exe"
          Copy-Item $executable $packagedExecutable
          Copy-Item help/*.md package/help/
          Copy-Item help/images package/help/ -Recurse -ErrorAction SilentlyContinue
          Copy-Item examples/* package/examples/ -Recurse
          Copy-Item translations/*.qm package/translations/
          & "${Env:Qt5_Dir}/bin/windeployqt.exe" --release --compiler-runtime --dir package $packagedExecutable
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-Windows_x64
          path: package
 
  pre-release:
    name: "pre-release"
    runs-on: "ubuntu-latest"
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    needs: [validate, buildwindows, buildmacos86, buildmacos-arm64, buildlinux]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4.1.7

      - name: Display structure of downloaded files
        run: zip -r SavvyCAN-Windows_x64_CIBuild.zip SavvyCAN-Windows_x64
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "continuous"
          prerelease: true
          title: "Development Build"
          files: |
            SavvyCAN-Linux_x64.AppImage/SavvyCAN-*x86_64.AppImage
            SavvyCAN-Windows_x64_CIBuild.zip
            SavvyCAN-macOS_x64.dmg/SavvyCAN_x64.dmg
            SavvyCAN-macOS_ARM64.dmg/SavvyCAN_arm64.dmg

  release:
    name: Publish tagged release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    permissions:
      contents: write
    needs: [validate, buildwindows, buildmacos86, buildmacos-arm64, buildlinux]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/download-artifact@v4

      - name: Prepare release files
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp SavvyCAN-Linux_x64.AppImage/*.AppImage \
            "release-assets/SavvyCAN-${RELEASE_TAG}-Linux-x86_64.AppImage"
          cp SavvyCAN-macOS_x64.dmg/SavvyCAN_x64.dmg \
            "release-assets/SavvyCAN-${RELEASE_TAG}-macOS-x86_64.dmg"
          cp SavvyCAN-macOS_ARM64.dmg/SavvyCAN_arm64.dmg \
            "release-assets/SavvyCAN-${RELEASE_TAG}-macOS-arm64.dmg"
          (cd SavvyCAN-Windows_x64 && zip -r \
            "../release-assets/SavvyCAN-${RELEASE_TAG}-Windows-x86_64.zip" .)
          printf 'Tag: %s\nCommit: %s\n' "$RELEASE_TAG" "$GITHUB_SHA" \
            > release-assets/BUILD-INFO.txt
          (cd release-assets && sha256sum SavvyCAN-* BUILD-INFO.txt > SHA256SUMS.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --title "SavvyCAN $RELEASE_TAG" \
              --generate-notes
          fi
