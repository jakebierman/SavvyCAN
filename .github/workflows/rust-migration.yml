name: Rust migration

on:
  push:
    branches:
      - feature/rust-slint-migration
    paths:
      - "rust/**"
      - ".github/workflows/rust-migration.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-migration.yml"
  workflow_dispatch:

jobs:
  core:
    name: Test core and receive-only transport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml -p savvycan-core -p savvycan-transports

  desktop:
    name: Check Slint desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev
      - run: cargo check --manifest-path rust/Cargo.toml -p savvycan-desktop
      - name: Test desktop data/view logic
        run: cargo test --manifest-path rust/Cargo.toml -p savvycan-desktop
      - name: Build runnable Linux preview
        run: cargo build --manifest-path rust/Cargo.toml -p savvycan-desktop
      - name: Build read-only ISO-TP trace inspector
        run: cargo build --manifest-path rust/Cargo.toml -p savvycan-core --bin savvycan-isotp
      - name: Build read-only J1939 BAM trace inspector
        run: cargo build --manifest-path rust/Cargo.toml -p savvycan-core --bin savvycan-j1939-bam
      - name: Build read-only byte activity inspector
        run: cargo build --manifest-path rust/Cargo.toml -p savvycan-core --bin savvycan-byte-activity
      - name: Upload Linux preview
        uses: actions/upload-artifact@v4
        with:
          name: savvycan-rust-slint-linux-x86_64
          path: |
            rust/target/debug/savvycan-desktop
            rust/target/debug/savvycan-isotp
            rust/target/debug/savvycan-j1939-bam
            rust/target/debug/savvycan-byte-activity
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Check Windows Slint desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust/Slint Windows target
        run: cargo check --manifest-path rust/Cargo.toml -p savvycan-desktop
      - name: Test Rust/Slint Windows data logic
        run: cargo test --manifest-path rust/Cargo.toml -p savvycan-desktop
      - name: Build runnable Windows preview
        run: cargo build --manifest-path rust/Cargo.toml -p savvycan-desktop
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: savvycan-rust-slint-windows-x86_64
          path: rust/target/debug/savvycan-desktop.exe
          if-no-files-found: error
          retention-days: 7

  rust-preview-release:
    name: Publish Rust/Slint preview release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/rust-slint-migration' &&
      contains(github.event.head_commit.message, '[rust-preview-release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [core, desktop, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux preview
        uses: actions/download-artifact@v4
        with:
          name: savvycan-rust-slint-linux-x86_64
          path: preview-linux
      - name: Download Windows preview
        uses: actions/download-artifact@v4
        with:
          name: savvycan-rust-slint-windows-x86_64
          path: preview-windows
      - name: Package preview archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tar -C preview-linux -czf "release-assets/savvycan-rust-slint-linux-x86_64.tar.gz" .
          (cd preview-windows && zip -r "../release-assets/savvycan-rust-slint-windows-x86_64.zip" .)
          printf 'Source commit: %s\nBranch: %s\nBuild type: debug preview (not a production installer)\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" > release-assets/BUILD-INFO.txt
          (cd release-assets && sha256sum savvycan-rust-slint-*.zip savvycan-rust-slint-*.tar.gz BUILD-INFO.txt > SHA256SUMS.txt)
      - name: Publish immutable-tagged prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: rust-slint-preview-2026-10-23
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace assets." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SavvyCAN Rust/Slint preview — 23 October 2026" \
            --notes "Early experimental Rust/Slint desktop rewrite. Linux x86-64 and Windows x86-64 debug previews; not installers or a production release. Includes offline trace import/replay, DBC decoding, and synchronized multi-signal plotting. CAN interfaces are receive-only: no hardware transmit, UDS active diagnostics, or programming. Original Qt SavvyCAN remains unchanged on master. See BUILD-INFO.txt and SHA256SUMS.txt for provenance."
